<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bilder</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; margin: 0; padding: 20px; }
  h1 { font-size: 1.2rem; margin-bottom: 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .grid a { display: block; }
  .grid img {
    max-width: 220px;
    max-height: 220px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .grid img:hover { transform: scale(1.04); }
  #lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #lightbox.active { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
  #lightbox-close {
    position: fixed; top: 18px; right: 24px;
    font-size: 2rem; cursor: pointer; color: #fff; user-select: none;
  }
  .empty { color: #888; }
</style>
</head>
<body>
<h1>Bilder-Galerie</h1>
<div class="grid" id="grid">
  <p class="empty">Keine Bilder gefunden. Lege Bilddateien in diesen Ordner und lade die Seite neu.</p>
</div>

<div id="lightbox">
  <span id="lightbox-close" onclick="closeLB()">&#x2715;</span>
  <img id="lb-img" src="" alt="">
</div>

<script>
const exts = ['jpg','jpeg','png','gif','webp','bmp','svg','avif'];

async function loadImages() {
  const res = await fetch('.');
  const html = await res.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const links = [...doc.querySelectorAll('a[href]')]
    .map(a => a.getAttribute('href'))
    .filter(h => exts.some(e => h.toLowerCase().endsWith('.' + e)));

  const grid = document.getElementById('grid');
  if (links.length === 0) return;
  grid.innerHTML = '';
  links.forEach(src => {
    const a = document.createElement('a');
    a.href = src;
    a.onclick = e => { e.preventDefault(); openLB(src); };
    const img = document.createElement('img');
    img.src = src;
    img.alt = src;
    a.appendChild(img);
    grid.appendChild(a);
  });
}

function openLB(src) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lightbox').classList.add('active');
}
function closeLB() {
  document.getElementById('lightbox').classList.remove('active');
  document.getElementById('lb-img').src = '';
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLB();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });

loadImages();
</script>
</body>
</html>

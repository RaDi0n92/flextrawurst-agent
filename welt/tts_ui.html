<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS</title>
<style>
:root {
  --bg: #1a0b21;
  --bg-soft: #24102d;
  --panel: #2d1539;
  --panel-2: #341844;
  --field: #3b1a4f;
  --field-hi: #4b2363;
  --border: #7c4aa3;
  --border-soft: #5d3578;
  --text: #faeaff;
  --muted: #d9b6e9;
  --quiet: #a476ba;
  --faint: #745084;
  --lilac: #d9b3ff;
  --lilac-strong: #b985f0;
  --pink: #ff7ac8;
  --pink-hot: #ff4fb3;
  --pink-soft: #ffd0ed;
  --danger: #ff6f9d;
  --ok: #f7a7dc;
  --warn: #f4c17a;
  --shadow: rgba(255, 122, 200, .16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 1rem .75rem 2rem;
}
h1 { font-size: 1.2rem; font-weight: 500; color: var(--pink-soft); margin-bottom: 1.5rem; letter-spacing: .08em; text-shadow: 0 0 22px var(--shadow); }
.box { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: .85rem; }

.panel {
  width: 100%; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px;
  padding: .78rem; display: flex; flex-direction: column; gap: .65rem;
  box-shadow: 0 10px 32px rgba(16, 3, 24, .26);
}
.panel-title {
  font-size: .72rem; color: var(--lilac); letter-spacing: .08em; text-transform: uppercase;
}
.grid2 { display: grid; grid-template-columns: 1fr; gap: .55rem; }
@media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } }

textarea {
  width: 100%; height: 200px;
  background: var(--field); border: 1px solid var(--border-soft); border-radius: 8px;
  color: var(--text); font-size: 1rem; padding: .9rem;
  resize: vertical; outline: none; line-height: 1.6;
  box-shadow: inset 0 0 0 1px rgba(255, 208, 237, .04);
}
textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 122, 200, .15), inset 0 0 0 1px rgba(255, 208, 237, .08); }

#reading-view {
  display: none;
  width: 100%; min-height: 80px; max-height: 280px; overflow-y: auto;
  background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 8px;
  padding: .9rem 1rem; line-height: 1.9; font-size: .93rem;
}
.rv-chunk { cursor: pointer; border-radius: 3px; padding: 1px 2px; }
.rv-chunk:hover  { background: var(--field-hi); }
.rv-chunk.active { background: var(--pink-hot); color: #240516; }
.rv-chunk.done   { color: var(--faint); }

.counter { font-size: .75rem; color: var(--quiet); text-align: right; }
.counter.warn { color: var(--warn); }
.counter.over { color: var(--danger); }

.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.lbl { font-size: .8rem; color: var(--muted); white-space: nowrap; }

select, input[type="text"] {
  min-height: 38px; background: var(--field); border: 1px solid var(--border-soft);
  border-radius: 7px; color: var(--text); font-size: .88rem; padding: .46rem .58rem;
  outline: none;
}
select:focus, input[type="text"]:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 122, 200, .14); }
select { min-width: 0; flex: 1; }
input[type="text"] { width: 100%; }

.chip {
  background: var(--panel-2); border: 1px solid var(--border-soft); color: var(--muted);
  border-radius: 5px; padding: .27rem .58rem; cursor: pointer;
  font-size: .83rem; transition: all .1s; user-select: none;
}
.chip:hover { border-color: var(--pink); color: var(--text); }
.chip.on { background: var(--pink-hot); border-color: var(--pink-soft); color: #28041b; }

button.main {
  padding: .52rem 1.4rem; border-radius: 7px; border: none;
  font-size: .9rem; cursor: pointer; transition: all .12s; user-select: none;
}
button.small, .file-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 38px; padding: .43rem .7rem; border-radius: 7px;
  border: 1px solid var(--border-soft); background: var(--panel-2); color: var(--muted);
  font-size: .82rem; cursor: pointer; transition: all .12s; white-space: nowrap;
}
button.small:hover:not(:disabled), .file-btn:hover { border-color: var(--pink); color: var(--text); background: var(--field-hi); }
button.small.primary { background: var(--pink-hot); border-color: var(--pink-soft); color: #28041b; }
button.small.danger { border-color: var(--danger); color: var(--pink-soft); }
button.small:disabled { opacity: .42; cursor: not-allowed; }
#btn-speak { background: var(--pink-hot); color: #28041b; box-shadow: 0 10px 28px var(--shadow); }
#btn-speak:hover:not(:disabled) { background: var(--pink); }
#btn-speak:disabled { background: #5c2a49; color: var(--quiet); cursor: not-allowed; box-shadow: none; }
#btn-pause { background: var(--lilac-strong); border: 1px solid var(--lilac); color: #21052e; }
#btn-pause:hover:not(:disabled) { border-color: var(--pink-soft); color: #21052e; background: var(--lilac); }
#btn-pause:disabled { opacity:.35; cursor:not-allowed; }
#btn-stop  { background: var(--panel-2); border: 1px solid var(--danger); color: var(--pink-soft); }
#btn-stop:hover:not(:disabled)  { border-color: var(--pink-soft); background: #53233d; }
#btn-stop:disabled  { opacity:.35; cursor:not-allowed; }

.seek-wrap {
  width: 100%; height: 8px; background: var(--panel-2);
  border-radius: 4px; cursor: pointer; position: relative; user-select: none;
}
#seek-fill { height: 100%; width: 0%; background: var(--pink); border-radius: 4px; pointer-events: none; }
#seek-knob {
  position: absolute; top: 50%; width: 14px; height: 14px;
  border-radius: 50%; background: var(--pink-soft);
  transform: translate(-50%,-50%); left: 0%;
  pointer-events: none; opacity: 0; transition: opacity .15s;
  box-shadow: 0 0 18px var(--shadow);
}
.seek-wrap:hover #seek-knob { opacity: 1; }

#st  { font-size: .8rem; color: var(--quiet); min-height: 1.1em; }
#st.ok    { color: var(--ok); }
#st.wait  { color: var(--lilac); }
#st.pause { color: var(--warn); }
#st.err   { color: var(--danger); }
#dbg { font-size: .72rem; color: var(--danger); word-break: break-all; min-height: 1em; }
.inf { font-size: .72rem; color: var(--faint); }
.voice-active { font-size: .76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.library-head { justify-content: space-between; align-items: center; }
.toolbar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.toolbar input[type="text"] { flex: 1 1 220px; }
.library-list { display: flex; flex-direction: column; gap: .5rem; max-height: 320px; overflow-y: auto; }
.clip {
  border: 1px solid var(--border-soft); border-radius: 8px; background: var(--bg-soft);
  padding: .62rem; display: grid; grid-template-columns: 1fr; gap: .5rem;
}
@media (min-width: 720px) { .clip { grid-template-columns: minmax(0,1fr) auto; align-items: center; } }
.clip.pick { border-color: var(--pink); box-shadow: inset 0 0 0 1px rgba(255, 122, 200, .18); }
.clip-title { color: var(--text); font-size: .9rem; margin-bottom: .18rem; }
.clip-text { color: var(--muted); font-size: .78rem; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; }
.clip-meta { color: var(--quiet); font-size: .7rem; margin-top: .24rem; }
.clip-extra { color: var(--muted); font-size: .74rem; margin-top: .28rem; line-height: 1.35; }
.clip-extra input { vertical-align: middle; margin-right: .3rem; accent-color: var(--pink); }
.clip-move { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin-top: .45rem; }
.clip-move select { min-height: 34px; font-size: .78rem; max-width: 260px; }
.clip-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
.star { color: var(--pink-soft); border-color: var(--pink); }
.clip-note { flex: 1 1 180px; min-height: 34px !important; font-size: .78rem !important; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.empty { color: var(--quiet); font-size: .82rem; border: 1px dashed var(--border-soft); border-radius: 8px; padding: .8rem; }
.translator { gap: .75rem; }
.translator-head {
  display: grid; grid-template-columns: 1fr; gap: .55rem;
}
.translator-controls { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; min-width: 0; }
.translator-controls select { flex: 1 1 260px; }
.translator-fields { display: grid; grid-template-columns: 1fr; gap: .65rem; }
@media (min-width: 720px) { .translator-fields { grid-template-columns: 1fr 1fr; } }
.lang-box { display: flex; flex-direction: column; gap: .38rem; min-width: 0; }
.lang-label {
  color: var(--pink-soft); font-size: .78rem; line-height: 1.35;
  min-height: 2.1em;
}
#translate-input, #translate-output { min-height: 190px; height: 190px; }
#translate-output { background: var(--bg-soft); }
#translate-output::placeholder { color: var(--quiet); }
@media (min-width: 720px) {
  body { padding: 2rem 1rem; }
  textarea { font-size: .93rem; }
}
@media (max-width: 520px) {
  h1 { margin-bottom: .9rem; }
  .panel { padding: .68rem; }
  .row, .toolbar, .translator-controls { align-items: stretch; }
  .row > *, .toolbar > *, .translator-controls > * { flex: 1 1 100%; }
  button.main, button.small, .file-btn { width: 100%; }
  select, input[type="text"] { width: 100%; }
  .voice-active { white-space: normal; line-height: 1.35; }
  #translate-input, #translate-output { min-height: 170px; height: 170px; }
}
</style>
</head>
<body>
<h1>TTS</h1>
<div class="box">

  <textarea id="ta" placeholder="Text eingeben … (max. 1.111.111 Zeichen)"></textarea>
  <div id="reading-view"></div>
  <div class="counter" id="ctr">0 / 1.111.111</div>

  <div class="row">
    <button class="main" id="btn-speak">▶ Sprechen</button>
    <button class="main" id="btn-pause" disabled>⏸ Pause</button>
    <button class="main" id="btn-stop"  disabled>■ Stop</button>
  </div>

  <div class="seek-wrap" id="seek-wrap">
    <div id="seek-fill"></div>
    <div id="seek-knob"></div>
  </div>
  <div class="inf" id="inf"></div>
  <div id="st"></div>
  <div id="dbg"></div>

  <div class="panel">
    <div class="panel-title">Stimme</div>
    <div class="row">
      <select id="voice-select" aria-label="Stimme auswählen"></select>
      <button class="small primary" id="btn-voice">Aktivieren</button>
      <button class="small" id="btn-voice-fav">★ Stimme</button>
    </div>
    <div class="row">
      <select id="voice-favorites" aria-label="Stimmen-Favoriten"></select>
      <button class="small danger" id="btn-voice-fav-remove">Favorit entfernen</button>
    </div>
    <div class="voice-active" id="active-voice">Aktiv: de-DE-FlorianMultilingualNeural</div>
  </div>

  <div class="row">
    <span class="lbl">Tempo:</span>
    <button class="chip on" data-r="+0%"  >x1</button>
    <button class="chip"    data-r="+50%" >x1,5</button>
    <button class="chip"    data-r="+75%" >x1,75</button>
    <button class="chip"    data-r="+100%">x2</button>
    <button class="chip"    data-r="+125%">x2,25</button>
    <button class="chip"    data-r="+150%">x2,5</button>
  </div>

  <div class="panel translator">
    <div class="translator-head">
      <div>
        <div class="panel-title">Übersetzen</div>
        <div class="inf">Eigener Textbereich nur für Übersetzung. Die Hauptstimme oben bleibt unverändert.</div>
      </div>
      <div class="translator-controls">
        <select id="translate-target" aria-label="Ausgabesprache"></select>
        <select id="translate-voice" aria-label="Übersetzungsstimme"></select>
        <button class="small primary" id="btn-translate">Übersetzen</button>
        <button class="small primary" id="btn-translate-speak" disabled title="Übersetzung mit der Zielsprachen-Stimme abspielen">▶ Übersetzung</button>
      </div>
    </div>
    <div class="translator-fields">
      <label class="lang-box">
        <span class="lang-label" id="source-language-label">Eingabe: Sprache wird beim Übersetzen erkannt</span>
        <textarea id="translate-input" placeholder="Text zum Übersetzen eingeben"></textarea>
      </label>
      <label class="lang-box">
        <span class="lang-label" id="target-language-label">Ausgabe: Sprache wählen</span>
        <textarea id="translate-output" readonly placeholder="Hier erscheint die Übersetzung als Text."></textarea>
      </label>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Speichern</div>
    <div class="grid2">
      <input id="clip-title" type="text" placeholder="Titel der Eingabe">
      <select id="save-category" aria-label="Kategorie fürs Speichern"></select>
      <input id="clip-tags" type="text" placeholder="Tags, durch Komma getrennt">
      <input id="clip-note" type="text" placeholder="Notiz">
    </div>
    <div class="row">
      <button class="small primary" id="btn-save">Eingabe speichern</button>
      <input id="new-category" type="text" placeholder="Neue Kategorie">
      <button class="small" id="btn-category">Kategorie erstellen</button>
    </div>
  </div>

  <div class="panel">
    <div class="row library-head">
      <div class="panel-title">Soundboard</div>
      <select id="filter-category" aria-label="Kategorie anzeigen"></select>
    </div>
    <div class="toolbar">
      <input id="library-search" type="text" placeholder="Suchen in Titel, Text, Tags, Notizen">
      <button class="small" id="btn-play-selected">Auswahl spielen</button>
      <button class="small" id="btn-batch-mp3">Batch MP3</button>
      <button class="small" id="btn-export-json">JSON</button>
      <label class="small file-btn">Import<input id="import-json" type="file" accept="application/json"></label>
      <button class="small" id="btn-offline-html">Offline HTML</button>
    </div>
    <div class="library-list" id="library-list"></div>
  </div>

</div>
<script>
(function(){
'use strict';

const ta      = document.getElementById('ta');
const rv      = document.getElementById('reading-view');
const ctrEl   = document.getElementById('ctr');
const btnSpk  = document.getElementById('btn-speak');
const btnPause= document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const voiceSel= document.getElementById('voice-select');
const btnVoice= document.getElementById('btn-voice');
const btnVoiceFav = document.getElementById('btn-voice-fav');
const btnVoiceFavRemove = document.getElementById('btn-voice-fav-remove');
const voiceFavSel = document.getElementById('voice-favorites');
const activeVoiceEl = document.getElementById('active-voice');
const clipTitle = document.getElementById('clip-title');
const clipTags = document.getElementById('clip-tags');
const clipNote = document.getElementById('clip-note');
const saveCat = document.getElementById('save-category');
const filterCat = document.getElementById('filter-category');
const newCat = document.getElementById('new-category');
const btnCat = document.getElementById('btn-category');
const btnSave = document.getElementById('btn-save');
const libraryList = document.getElementById('library-list');
const librarySearch = document.getElementById('library-search');
const btnPlaySelected = document.getElementById('btn-play-selected');
const btnBatchMp3 = document.getElementById('btn-batch-mp3');
const btnExportJson = document.getElementById('btn-export-json');
const importJson = document.getElementById('import-json');
const btnOfflineHtml = document.getElementById('btn-offline-html');
const translateTarget = document.getElementById('translate-target');
const translateVoiceSel = document.getElementById('translate-voice');
const btnTranslate = document.getElementById('btn-translate');
const btnTranslateSpeak = document.getElementById('btn-translate-speak');
const translateInput = document.getElementById('translate-input');
const translateOutput = document.getElementById('translate-output');
const sourceLanguageLabel = document.getElementById('source-language-label');
const targetLanguageLabel = document.getElementById('target-language-label');
const seekW   = document.getElementById('seek-wrap');
const seekF   = document.getElementById('seek-fill');
const seekK   = document.getElementById('seek-knob');
const infEl   = document.getElementById('inf');
const stEl    = document.getElementById('st');
const dbgEl   = document.getElementById('dbg');

/* API-URL relativ zum aktuellen Pfad — funktioniert unter /tts/ */
const BASE = location.pathname.replace(/[^/]*$/, '');
const API  = BASE + 'speak';
const VOICES_API = BASE + 'voices';
const TRANSLATE_API = BASE + 'translate';
const TRANSLATE_LANGS_API = BASE + 'translation-languages';
const LIBRARY_API = BASE + 'library';
const OFFLINE_API = BASE + 'offline.html';
const AUDIO_ZIP_API = BASE + 'export-audio';

const MAX = 1111111;
const CK  = 280;
const STORE_KEY = 'flextrawurst.tts.soundboard.v1';
const DEFAULT_VOICE = 'de-DE-FlorianMultilingualNeural';
const DEFAULT_VOICE_FAVORITES = ['de-DE-FlorianMultilingualNeural', 'de-DE-KillianNeural', 'de-DE-KatjaNeural'];
const AUDIO_CACHE_LIMIT = 80;
const DEFAULT_CAT = 'Allgemein';
const TRANSLATE_VOICE_KEY = 'flextrawurst.tts.translateVoices.v1';

let rate    = '+0%';
let activeVoice = localStorage.getItem('tts.activeVoice') || DEFAULT_VOICE;
let store = loadStore();
let chunks  = [];
let sess    = 0;
let paused  = false;
let pResume = null;
let curSrc  = null;
let actx    = null;
let selectedClips = new Set();
let serverReady = false;
let audioCache = new Map();
let availableVoices = [];
let translationLanguages = [];
let translateVoicePrefs = loadTranslateVoicePrefs();

function st(msg, cls) { stEl.textContent = msg; stEl.className = cls || ''; }
function dbg(msg)     { dbgEl.textContent = msg; }
function ctrl(on)     { btnSpk.disabled=on; btnPause.disabled=!on; btnStop.disabled=!on; }
function pct(i)       { return chunks.length ? (i/chunks.length*100).toFixed(1)+'%' : '0%'; }
function setSeek(p)   { seekF.style.width=p; seekK.style.left=p; }
function uid()         { return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function esc(s)        { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shortText(s,n){ return s.length > n ? s.slice(0,n-1).trim()+'…' : s; }

function loadTranslateVoicePrefs(){
  try {
    const data = JSON.parse(localStorage.getItem(TRANSLATE_VOICE_KEY) || '{}');
    return data && typeof data === 'object' ? data : {};
  } catch(e) {
    return {};
  }
}

function saveTranslateVoicePrefs(){
  localStorage.setItem(TRANSLATE_VOICE_KEY, JSON.stringify(translateVoicePrefs));
}

const languageNames = typeof Intl !== 'undefined' && Intl.DisplayNames
  ? new Intl.DisplayNames(['de'], {type:'language'})
  : null;
const regionNames = typeof Intl !== 'undefined' && Intl.DisplayNames
  ? new Intl.DisplayNames(['de'], {type:'region'})
  : null;
const languageNameFallbacks = {
  auto: 'Automatisch erkennen',
  de: 'Deutsch',
  en: 'Englisch',
  fr: 'Franzoesisch',
  es: 'Spanisch',
  it: 'Italienisch',
  pt: 'Portugiesisch',
  nl: 'Niederlaendisch',
  pl: 'Polnisch',
  ru: 'Russisch',
  uk: 'Ukrainisch',
  tr: 'Tuerkisch',
  ar: 'Arabisch',
  zh: 'Chinesisch',
  'zh-CN': 'Chinesisch, vereinfacht',
  'zh-TW': 'Chinesisch, traditionell',
  ja: 'Japanisch',
  ko: 'Koreanisch',
  no: 'Norwegisch',
  sv: 'Schwedisch',
  da: 'Daenisch',
  fi: 'Finnisch',
  tl: 'Tagalog'
};

function languageDisplay(lang){
  const code = String(lang || 'auto').trim() || 'auto';
  if (languageNameFallbacks[code]) return `${languageNameFallbacks[code]} (${code})`;
  try {
    const name = languageNames?.of(code);
    if (name && name !== code) return `${name.charAt(0).toUpperCase()}${name.slice(1)} (${code})`;
  } catch(e) {}
  return `${code} (${code})`;
}

function languageNameOnly(lang){
  return languageDisplay(lang).replace(/\s*\([^)]*\)$/, '');
}

function regionDisplay(region){
  const code = String(region || '').trim().toUpperCase();
  if (!code) return '';
  try {
    const name = regionNames?.of(code);
    if (name && name !== code) return name;
  } catch(e) {}
  return code;
}

function localeDisplay(locale){
  const loc = String(locale || '').trim().replace('_','-');
  if (!loc) return 'Sprache unbekannt';
  const parts = loc.split('-');
  const lang = targetFromLocale(loc);
  const region = parts.length > 1 ? regionDisplay(parts[1]) : '';
  const name = languageNameOnly(lang);
  return region ? `${name} - ${region} (${loc})` : `${name} (${loc})`;
}

function genderDisplay(gender){
  const value = String(gender || '').toLowerCase();
  if (value === 'male') return 'maennlich';
  if (value === 'female') return 'weiblich';
  if (value === 'neutral') return 'neutral';
  return gender || '?';
}

function langByTarget(target){
  return translationLanguages.find(x=>x.target_lang === target);
}

function translationVoice(){
  return translateVoiceSel.value || voiceForTarget(translateTarget.value);
}

function voiceByName(name){
  return availableVoices.find(v=>(v.name || v.ShortName) === name);
}

function voiceDisplay(name){
  const voice = voiceByName(name);
  if (!voice) return name || 'keine Stimme';
  return `${localeDisplay(voice.locale || voice.Locale)} · ${name}`;
}

function updateTranslateSpeakState(){
  btnTranslateSpeak.disabled = !translateOutput.value.trim();
}

function updateTargetLanguageLabel(){
  const lang = langByTarget(translateTarget.value);
  if (!lang){
    targetLanguageLabel.textContent = 'Ausgabe: Sprache wählen';
    return;
  }
  const voice = translationVoice();
  targetLanguageLabel.textContent = `Ausgabe: ${languageDisplay(lang.target_lang)} · Stimme: ${voiceDisplay(voice)}`;
}

function voicesForTarget(target){
  const t = String(target || '').toLowerCase();
  return availableVoices.filter(v=>targetFromLocale(v.locale || v.Locale).toLowerCase() === t);
}

function renderTranslationVoices(){
  const target = translateTarget.value;
  const voices = voicesForTarget(target);
  if (!voices.length){
    const fallback = voiceForTarget(target);
    translateVoiceSel.innerHTML = `<option value="${esc(fallback)}">${esc(voiceDisplay(fallback))}</option>`;
    translateVoiceSel.value = fallback;
    updateTargetLanguageLabel();
    return;
  }
  translateVoiceSel.innerHTML = voices.map(v=>{
    const name = v.name || v.ShortName;
    const label = `${voiceDisplay(name)} · ${genderDisplay(v.gender || v.Gender)}`;
    return `<option value="${esc(name)}">${esc(label)}</option>`;
  }).join('');
  const saved = translateVoicePrefs[target];
  const preferred = saved && voices.some(v=>(v.name || v.ShortName) === saved)
    ? saved
    : (voices[0].name || voices[0].ShortName);
  translateVoiceSel.value = preferred;
  updateTargetLanguageLabel();
}
function fileSafe(s){
  return (s || 'tts')
    .toLowerCase()
    .replace(/[^a-z0-9äöüß_-]+/gi,'-')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'')
    .slice(0,80) || 'tts';
}
function isNeutralGermanVoice(v){
  return v === 'de-DE-FlorianMultilingualNeural' || v === 'de-DE-SeraphinaMultilingualNeural';
}
function targetFromLocale(locale){
  const low = String(locale || '').replace('_','-').toLowerCase();
  if (low.startsWith('zh-cn') || low.startsWith('zh-sg')) return 'zh-CN';
  if (low.startsWith('zh-tw') || low.startsWith('zh-hk')) return 'zh-TW';
  if (low.startsWith('fil-')) return 'tl';
  if (low.startsWith('nb-')) return 'no';
  return low.split('-')[0] || '';
}
function voiceForTarget(target){
  const t = String(target || '').toLowerCase();
  const match = availableVoices.find(v=>targetFromLocale(v.locale || v.Locale).toLowerCase() === t);
  return match ? (match.name || match.ShortName || activeVoice) : activeVoice;
}
function textStats(s){
  const chars = String(s || '').length;
  return {
    chars,
    tokens: Math.max(1, Math.ceil(chars / 4))
  };
}
function parseTags(s){
  return String(s || '')
    .split(',')
    .map(x=>x.trim())
    .filter(Boolean)
    .filter((x,i,a)=>a.indexOf(x) === i);
}
function rateFactor(r){
  const n = parseInt(String(r || '+0%').replace('%',''), 10);
  return 1 + (Number.isFinite(n) ? n : 0) / 100;
}
function durationText(text, r){
  const chars = String(text || '').length;
  const seconds = Math.max(1, Math.round(chars / (13 * Math.max(.25, rateFactor(r)))));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${String(s).padStart(2,'0')} min`;
}
function normalizeStore(raw){
  const categories = Array.isArray(raw && raw.categories) ? raw.categories.filter(Boolean) : [DEFAULT_CAT];
  const clips = Array.isArray(raw && raw.clips) ? raw.clips : [];
  const voiceFavorites = Array.isArray(raw && raw.voiceFavorites) ? raw.voiceFavorites.filter(Boolean) : DEFAULT_VOICE_FAVORITES;
  const cleanVoiceFavorites = voiceFavorites.filter(v=>!String(v).includes(':DragonHD'));
  return {
    categories: Array.from(new Set([DEFAULT_CAT, ...categories])),
    clips: clips.map(c=>({
      id: c.id || uid(),
      title: c.title || 'Ohne Titel',
      text: c.text || '',
      category: c.category || DEFAULT_CAT,
      voice: c.voice || DEFAULT_VOICE,
      rate: c.rate || '+0%',
      createdAt: c.createdAt || new Date().toISOString(),
      favorite: !!c.favorite,
      tags: Array.isArray(c.tags) ? c.tags.filter(Boolean) : parseTags(c.tags),
      note: c.note || ''
    })),
    voiceFavorites: Array.from(new Set(cleanVoiceFavorites.length ? cleanVoiceFavorites : DEFAULT_VOICE_FAVORITES))
  };
}
function mergeStores(a,b){
  const left = normalizeStore(a || {});
  const right = normalizeStore(b || {});
  const byId = new Map();
  [...left.clips, ...right.clips].forEach(c=>byId.set(c.id, c));
  return normalizeStore({
    categories: [...left.categories, ...right.categories],
    clips: Array.from(byId.values()),
    voiceFavorites: [...left.voiceFavorites, ...right.voiceFavorites]
  });
}

function rememberAudio(key, buf){
  if (audioCache.has(key)) audioCache.delete(key);
  audioCache.set(key, buf);
  while (audioCache.size > AUDIO_CACHE_LIMIT){
    audioCache.delete(audioCache.keys().next().value);
  }
}

async function speakTranslation(){
  const raw = translateOutput.value.trim();
  if (!raw){ st('Keine Übersetzung zum Sprechen.','err'); return; }
  const clean = strip(raw);
  if (!clean){ st('Keine lesbare Übersetzung.','err'); return; }
  const parts = splitChunks(clean);
  const voice = translationVoice();
  if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if (actx.state === 'suspended') await actx.resume();
  sess++;
  const sid = sess;
  if (curSrc){ try{ curSrc.stop(); }catch(e){} curSrc=null; }
  paused = false;
  if (pResume){ pResume(); pResume=null; }
  btnPause.textContent = '⏸ Pause';
  ctrl(true);
  rv.style.display = 'none';
  setSeek('0%');
  dbg('');
  try {
    for (let i=0; i<parts.length; i++){
      if (sid !== sess) return;
      st(`Übersetzung lädt ${i+1}/${parts.length}…`,'wait');
      const ab = await fetchAudioPart(parts[i], voice, rate);
      if (sid !== sess) return;
      const buf = await actx.decodeAudioData(ab.slice(0));
      setSeek((i / parts.length * 100).toFixed(1)+'%');
      infEl.textContent = `${i+1} / ${parts.length} · ${voice}`;
      st(`Übersetzung spricht ${i+1}/${parts.length}`,'ok');
      await playBuf(buf, sid);
    }
    if (sid !== sess) return;
    setSeek('100%');
    st('Übersetzung fertig.','');
  } catch(e){
    if (sid === sess) st('Übersetzungsstimme fehlgeschlagen: '+e.message,'err');
  } finally {
    if (sid === sess){
      infEl.textContent = '';
      ctrl(false);
      btnPause.textContent = '⏸ Pause';
      rv.style.display = 'none';
      dbg('');
    }
  }
}

async function fetchAudioPart(text, voice, rateValue){
  let lastErr;
  for (let attempt=1; attempt<=4; attempt++){
    try {
      dbg(`download fetch ${attempt}/4…`);
      const r = await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text, rate: rateValue || '+0%', voice: voice || DEFAULT_VOICE})
      });
      if (!r.ok) throw new Error('HTTP '+r.status);
      const ab = await r.arrayBuffer();
      dbg('');
      return ab;
    } catch(e){
      lastErr = e;
      dbg(`download fehler ${attempt}: ${e.message}`);
      if (attempt < 4) await new Promise(r=>setTimeout(r, 900*attempt));
    }
  }
  throw lastErr;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

function encodeWav(audioBuffer){
  const channels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const samples = audioBuffer.length;
  const blockAlign = channels * 2;
  const dataSize = samples * blockAlign;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  let offset = 0;
  const writeString = s => {
    for (let i=0; i<s.length; i++) view.setUint8(offset++, s.charCodeAt(i));
  };
  writeString('RIFF');
  view.setUint32(offset, 36 + dataSize, true); offset += 4;
  writeString('WAVE');
  writeString('fmt ');
  view.setUint32(offset, 16, true); offset += 4;
  view.setUint16(offset, 1, true); offset += 2;
  view.setUint16(offset, channels, true); offset += 2;
  view.setUint32(offset, sampleRate, true); offset += 4;
  view.setUint32(offset, sampleRate * blockAlign, true); offset += 4;
  view.setUint16(offset, blockAlign, true); offset += 2;
  view.setUint16(offset, 16, true); offset += 2;
  writeString('data');
  view.setUint32(offset, dataSize, true); offset += 4;
  const channelData = [];
  for (let ch=0; ch<channels; ch++) channelData.push(audioBuffer.getChannelData(ch));
  for (let i=0; i<samples; i++){
    for (let ch=0; ch<channels; ch++){
      const s = Math.max(-1, Math.min(1, channelData[ch][i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      offset += 2;
    }
  }
  return new Blob([buffer], {type:'audio/wav'});
}

function joinAudioBuffers(buffers){
  if (!buffers.length) throw new Error('Keine Audio-Daten.');
  const sampleRate = buffers[0].sampleRate;
  const channels = buffers[0].numberOfChannels;
  const total = buffers.reduce((sum,b)=>sum+b.length, 0);
  const merged = actx.createBuffer(channels, total, sampleRate);
  let offset = 0;
  buffers.forEach(buf=>{
    for (let ch=0; ch<channels; ch++){
      merged.getChannelData(ch).set(buf.getChannelData(Math.min(ch, buf.numberOfChannels-1)), offset);
    }
    offset += buf.length;
  });
  return merged;
}

async function downloadClip(id, format){
  const clip = store.clips.find(c=>c.id === id);
  if (!clip) return;
  const clean = strip(clip.text);
  if (!clean){ st('Kein lesbarer Text für Download.','err'); return; }
  const parts = splitChunks(clean);
  const voice = clip.voice || DEFAULT_VOICE;
  const rateValue = clip.rate || '+0%';
  const baseName = fileSafe(clip.title);
  st(`Download ${format.toUpperCase()} 1/${parts.length}…`,'wait');
  try {
    const audioParts = [];
    for (let i=0; i<parts.length; i++){
      st(`Download ${format.toUpperCase()} ${i+1}/${parts.length}…`,'wait');
      audioParts.push(await fetchAudioPart(parts[i], voice, rateValue));
    }
    if (format === 'mp3'){
      downloadBlob(new Blob(audioParts, {type:'audio/mpeg'}), `${baseName}.mp3`);
    } else {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      const decoded = [];
      for (const part of audioParts) decoded.push(await actx.decodeAudioData(part.slice(0)));
      downloadBlob(encodeWav(joinAudioBuffers(decoded)), `${baseName}.wav`);
    }
    st(`Download ${format.toUpperCase()} fertig.`,'ok');
  } catch(e){
    st(`Download fehlgeschlagen: ${e.message}`,'err');
  } finally {
    dbg('');
  }
}

  const ids = selectedIds();
  if (!ids.length){ st('Keine Clips ausgewählt.','err'); return; }
  st('Batch-MP3 wird gebaut…','wait');
  try {
    const r = await fetch(AUDIO_ZIP_API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ids, format:'mp3'})
    });
    if (!r.ok) throw new Error('HTTP '+r.status);
    downloadBlob(await r.blob(), 'tts-clips-mp3.zip');
    st('Batch-MP3 fertig.','ok');
  } catch(e){
    st('Batch-MP3 fehlgeschlagen: '+e.message,'err');
  }
}

function exportJson(){

async function importJsonFile(file){
  if (!file) return;
  try {
    const incoming = normalizeStore(JSON.parse(await file.text()));
    store = mergeStores(store, incoming);
    saveStore();
    renderLibrary();
    st('JSON importiert.','ok');
  } catch(e){
    st('Import fehlgeschlagen: '+e.message,'err');
  } finally {
    importJson.value = '';
  }
}

async function downloadOfflineHtml(){
  try {
    const r = await fetch(OFFLINE_API, {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    downloadBlob(await r.blob(), 'tts-soundboard-offline.html');
  } catch(e){
    downloadBlob(new Blob([document.documentElement.outerHTML], {type:'text/html'}), 'tts-soundboard-offline.html');
  }
}

function strip(t){
  return t
    .replace(/```[\s\S]*?```/g,' ')
    .replace(/`[^`]+`/g,' ')
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/\*([^*]+)\*/g,'$1')
    .replace(/__([^_]+)__/g,'$1')
    .replace(/_([^_]+)_/g,'$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/^[-*+]\s+/gm,'')
    .replace(/^\d+\.\s+/gm,'')
    .replace(/^[-_*]{3,}$/gm,'')
    .replace(/>\s*/gm,'')
    .replace(/[ \t]{2,}/g,' ')
    .trim();
}

function splitChunks(t){
  const parts = [];
  let rest = t;
  while (rest.length > 0){
    if (rest.length <= CK){ parts.push(rest.trim()); break; }
    const sub = rest.slice(0, CK);
    const m   = sub.search(/[.!?][^.!?]*$/);
    if (m > 10){
      parts.push(rest.slice(0, m+1).trim());
      rest = rest.slice(m+1).trim();
    } else {
      const sp = sub.lastIndexOf(' ');
      if (sp > 0){ parts.push(sub.slice(0,sp).trim()); rest = rest.slice(sp).trim(); }
      else       { parts.push(sub.trim()); rest = rest.slice(CK).trim(); }
    }
  }
  return parts.filter(p=>p.length>0);
}

function buildRV(){
  rv.innerHTML = chunks.map((c,i)=>{
    const safe = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<span class="rv-chunk" data-i="${i}">${safe} </span>`;
  }).join('');
  rv.querySelectorAll('.rv-chunk').forEach(el=>{
    el.addEventListener('click', ()=>jump(+el.dataset.i));
  });
}

function hlRV(i){
  rv.querySelectorAll('.rv-chunk').forEach((el,j)=>{
    el.className = 'rv-chunk'+(j<i?' done':j===i?' active':'');
  });
  const a = rv.querySelector('.rv-chunk.active');
  if (a) a.scrollIntoView({block:'nearest',behavior:'smooth'});
}

async function fetchBuf(text, sid){
  const key = audioCacheKey(text, activeVoice, rate);
  const cached = audioCache.get(key);
  if (cached){
    dbg('cache');
    return cached;
  }
  let lastErr;
  for (let attempt=1; attempt<=4; attempt++){
    if (sid !== sess) throw new Error('dead');
    try {
      dbg(`fetch ${attempt}/4…`);
      const r = await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text, rate, voice: activeVoice})
      });
      if (!r.ok) throw new Error('HTTP '+r.status);
      const ab = await r.arrayBuffer();
      if (sid !== sess) throw new Error('dead');
      dbg('');
      const decoded = await actx.decodeAudioData(ab);
      rememberAudio(key, decoded);
      return decoded;
    } catch(e){
      if (e.message==='dead') throw e;
      lastErr = e;
      dbg(`fehler ${attempt}: ${e.message}`);
      if (attempt < 4 && sid === sess){
        await new Promise(r=>setTimeout(r, 900*attempt));
      }
    }
  }
  throw lastErr;
}

function playBuf(buf, sid){
  return new Promise(resolve=>{
    if (sid !== sess){ resolve(); return; }
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.onended = resolve;
    curSrc = src;
    src.start(0);
  });
}

function waitResume(sid){
  if (!paused || sid !== sess) return Promise.resolve();
  return new Promise(r=>{ pResume = r; });
}

async function loop(from, sid){
  const tot = chunks.length;
  for (let i=from; i<tot; i++){
    if (sid !== sess) return;
    await waitResume(sid);
    if (sid !== sess) return;

    st(`Lädt ${i+1}/${tot}…`,'wait');

    let buf;
    try {
      buf = await fetchBuf(chunks[i], sid);
    } catch(e){
      if (sid !== sess) return;
      st('Fehler: '+e.message,'err');
      ctrl(false);
      rv.style.display='none';
      return;
    }

    if (sid !== sess) return;
    await waitResume(sid);
    if (sid !== sess) return;

    setSeek(pct(i));
    infEl.textContent = `${i+1} / ${tot}`;
    hlRV(i);
    st(`Spielt ${i+1}/${tot}`,'ok');

    await playBuf(buf, sid);
  }

  if (sid !== sess) return;
  setSeek('100%');
  hlRV(tot);
  st('Fertig ✓','');
  infEl.textContent='';
  ctrl(false);
  btnPause.textContent='⏸ Pause';
  rv.style.display='none';
}

async function startFrom(from){
  if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if (actx.state === 'suspended') await actx.resume();

  sess++;
  const sid = sess;

  if (curSrc){ try{ curSrc.stop(); }catch(e){} curSrc=null; }
  paused = false;
  if (pResume){ pResume(); pResume=null; }
  btnPause.textContent = '⏸ Pause';
  ctrl(true);
  setSeek(pct(from));
  dbg('');
  rv.style.display = 'block';

  await loop(from, sid);
}

function jump(i){
  if (!chunks.length) return;
  startFrom(Math.max(0, Math.min(chunks.length-1, i)));
}

libraryList.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-act]');
  const clipEl = e.target.closest('.clip');
  if (!btn || !clipEl) return;
  const id = clipEl.dataset.id;
  const clip = store.clips.find(c=>c.id === id);
  if (btn.dataset.act === 'load') loadClip(id, false);
  if (btn.dataset.act === 'play') loadClip(id, true);
  if (btn.dataset.act === 'mp3') downloadClip(id, 'mp3');
  if (btn.dataset.act === 'wav') downloadClip(id, 'wav');
  if (btn.dataset.act === 'favorite' && clip){
    clip.favorite = !clip.favorite;
    saveStore();
    renderLibrary();
  }
  if (btn.dataset.act === 'duplicate' && clip){
    store.clips.push({...clip, id: uid(), title: clip.title+' Kopie', createdAt: new Date().toISOString()});
    saveStore();
    renderLibrary();
    st('Dupliziert.','ok');
  }
  if (btn.dataset.act === 'delete'){
    store.clips = store.clips.filter(c=>c.id !== id);
    selectedClips.delete(id);
    saveStore();
    renderLibrary();
    st('Gelöscht.','');
  }
});

libraryList.addEventListener('change', e=>{
  const pick = e.target.closest('input[data-act="pick"]');
  const sel = e.target.closest('select[data-act="move"]');
  const clipEl = e.target.closest('.clip');
  if (!clipEl) return;
  if (pick){
    if (pick.checked) selectedClips.add(clipEl.dataset.id);
    else selectedClips.delete(clipEl.dataset.id);
    renderLibrary();
    return;
  }
  if (!sel) return;
  const clip = store.clips.find(c=>c.id === clipEl.dataset.id);
  if (!clip) return;
  clip.category = sel.value || DEFAULT_CAT;
  saveStore();
  renderLibrary();
  st('Verschoben nach: '+clip.category,'ok');
});

libraryList.addEventListener('input', e=>{
  const note = e.target.closest('input[data-act="note"]');
  const clipEl = e.target.closest('.clip');
  if (!note || !clipEl) return;
  const clip = store.clips.find(c=>c.id === clipEl.dataset.id);
  if (!clip) return;
  clip.note = note.value;
  saveStore();
});

btnPause.addEventListener('click', ()=>{
  if (!actx) return;
  if (paused){
    paused = false;
    btnPause.textContent = '⏸ Pause';
    st('Spielt …','ok');
    actx.resume();
    if (pResume){ pResume(); pResume=null; }
  } else {
    paused = true;
    btnPause.textContent = '▶ Weiter';
    st('Pausiert','pause');
    actx.suspend();
  }
});

btnStop.addEventListener('click', ()=>{
  sess++;
  paused = false;
  if (pResume){ pResume(); pResume=null; }
  if (curSrc){ try{ curSrc.stop(); }catch(e){} curSrc=null; }
  setSeek('0%');
  infEl.textContent='';
  dbg('');
  st('Gestoppt.','');
  ctrl(false);
  btnPause.textContent = '⏸ Pause';
  rv.style.display = 'none';
});

let dragging = false;
function seekPos(cx){
  const r = seekW.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (cx-r.left)/r.width));
  setSeek((p*100).toFixed(1)+'%');
  return Math.floor(p * chunks.length);
}
seekW.addEventListener('mousedown', e=>{
  if (!chunks.length) return;
  dragging=true; e.preventDefault();
  seekPos(e.clientX);
});
document.addEventListener('mousemove', e=>{ if(dragging) seekPos(e.clientX); });
document.addEventListener('mouseup',   e=>{
  if (!dragging) return;
  dragging=false;
  jump(seekPos(e.clientX));
});
seekW.addEventListener('touchstart', e=>{
  if (!chunks.length) return;
  dragging=true; seekPos(e.touches[0].clientX);
},{passive:true});
document.addEventListener('touchmove', e=>{ if(dragging) seekPos(e.touches[0].clientX); },{passive:true});
document.addEventListener('touchend',  e=>{
  if (!dragging) return;
  dragging=false;
  jump(seekPos(e.changedTouches[0].clientX));
});

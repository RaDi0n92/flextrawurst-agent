<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS · Florian</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0e0e0f; color: #d4d4d4;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 2rem 1rem;
}
h1 { font-size: 1.2rem; font-weight: 400; color: #888; margin-bottom: 1.5rem; letter-spacing: .08em; }
.box { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: .85rem; }

.panel {
  width: 100%; background: #141415; border: 1px solid #272727; border-radius: 8px;
  padding: .78rem; display: flex; flex-direction: column; gap: .65rem;
}
.panel-title {
  font-size: .72rem; color: #666; letter-spacing: .08em; text-transform: uppercase;
}
.grid2 { display: grid; grid-template-columns: 1fr; gap: .55rem; }
@media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } }

textarea {
  width: 100%; height: 200px;
  background: #1a1a1b; border: 1px solid #2e2e2e; border-radius: 8px;
  color: #d4d4d4; font-size: .93rem; padding: .9rem;
  resize: vertical; outline: none; line-height: 1.6;
}
textarea:focus { border-color: #555; }

#reading-view {
  display: none;
  width: 100%; min-height: 80px; max-height: 280px; overflow-y: auto;
  background: #101211; border: 1px solid #1e2e1e; border-radius: 8px;
  padding: .9rem 1rem; line-height: 1.9; font-size: .93rem;
}
.rv-chunk { cursor: pointer; border-radius: 3px; padding: 1px 2px; }
.rv-chunk:hover  { background: #202820; }
.rv-chunk.active { background: #1a3d1a; color: #9de09d; }
.rv-chunk.done   { color: #383838; }

.counter { font-size: .75rem; color: #555; text-align: right; }
.counter.warn { color: #e07b39; }
.counter.over { color: #d94f4f; }

.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.lbl { font-size: .8rem; color: #666; white-space: nowrap; }

select, input[type="text"] {
  min-height: 38px; background: #1a1a1b; border: 1px solid #2e2e2e;
  border-radius: 7px; color: #d4d4d4; font-size: .88rem; padding: .46rem .58rem;
  outline: none;
}
select:focus, input[type="text"]:focus { border-color: #555; }
select { min-width: 0; flex: 1; }
input[type="text"] { width: 100%; }

.chip {
  background: #1c1c1d; border: 1px solid #2a2a2a; color: #999;
  border-radius: 5px; padding: .27rem .58rem; cursor: pointer;
  font-size: .83rem; transition: all .1s; user-select: none;
}
.chip:hover { border-color: #4a4a4a; color: #ccc; }
.chip.on { background: #1f2f1f; border-color: #4a7a4a; color: #80cc80; }

button.main {
  padding: .52rem 1.4rem; border-radius: 7px; border: none;
  font-size: .9rem; cursor: pointer; transition: all .12s; user-select: none;
}
button.small {
  min-height: 38px; padding: .43rem .7rem; border-radius: 7px;
  border: 1px solid #383838; background: #1d1d1e; color: #aaa;
  font-size: .82rem; cursor: pointer; transition: all .12s; white-space: nowrap;
}
button.small:hover:not(:disabled) { border-color: #666; color: #ddd; }
button.small.primary { background: #223f22; border-color: #396239; color: #8fd28f; }
button.small.danger { border-color: #48222a; color: #cc7070; }
button.small:disabled { opacity: .42; cursor: not-allowed; }
#btn-speak { background: #2a522a; color: #90d090; }
#btn-speak:hover:not(:disabled) { background: #336033; }
#btn-speak:disabled { background: #1c2a1c; color: #456045; cursor: not-allowed; }
#btn-pause { background: #1e1e1f; border: 1px solid #383838; color: #aaa; }
#btn-pause:hover:not(:disabled) { border-color: #666; color: #ddd; }
#btn-pause:disabled { opacity:.35; cursor:not-allowed; }
#btn-stop  { background: #1e1e1f; border: 1px solid #48222a; color: #cc7070; }
#btn-stop:hover:not(:disabled)  { border-color: #703030; background: #281818; }
#btn-stop:disabled  { opacity:.35; cursor:not-allowed; }

.seek-wrap {
  width: 100%; height: 8px; background: #1c1c1d;
  border-radius: 4px; cursor: pointer; position: relative; user-select: none;
}
#seek-fill { height: 100%; width: 0%; background: #467846; border-radius: 4px; pointer-events: none; }
#seek-knob {
  position: absolute; top: 50%; width: 14px; height: 14px;
  border-radius: 50%; background: #70c870;
  transform: translate(-50%,-50%); left: 0%;
  pointer-events: none; opacity: 0; transition: opacity .15s;
}
.seek-wrap:hover #seek-knob { opacity: 1; }

#st  { font-size: .8rem; color: #666; min-height: 1.1em; }
#st.ok    { color: #70c870; }
#st.wait  { color: #6a8a6a; }
#st.pause { color: #c8b060; }
#st.err   { color: #cc6060; }
#dbg { font-size: .72rem; color: #6a3a3a; word-break: break-all; min-height: 1em; }
.inf { font-size: .72rem; color: #3a3a3a; }
.voice-active { font-size: .76rem; color: #777; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.library-head { justify-content: space-between; align-items: center; }
.library-list { display: flex; flex-direction: column; gap: .5rem; max-height: 320px; overflow-y: auto; }
.clip {
  border: 1px solid #272727; border-radius: 8px; background: #111112;
  padding: .62rem; display: grid; grid-template-columns: 1fr; gap: .5rem;
}
@media (min-width: 720px) { .clip { grid-template-columns: minmax(0,1fr) auto; align-items: center; } }
.clip-title { color: #d2d2d2; font-size: .9rem; margin-bottom: .18rem; }
.clip-text { color: #777; font-size: .78rem; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; }
.clip-meta { color: #4c4c4c; font-size: .7rem; margin-top: .24rem; }
.clip-move { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin-top: .45rem; }
.clip-move select { min-height: 34px; font-size: .78rem; max-width: 260px; }
.clip-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
.empty { color: #555; font-size: .82rem; border: 1px dashed #2b2b2b; border-radius: 8px; padding: .8rem; }
</style>
</head>
<body>
<h1>TTS · Florian</h1>
<div class="box">

  <textarea id="ta" placeholder="Text eingeben … (max. 1.111.111 Zeichen)"></textarea>
  <div id="reading-view"></div>
  <div class="counter" id="ctr">0 / 1.111.111</div>

  <div class="panel">
    <div class="panel-title">Stimme</div>
    <div class="row">
      <select id="voice-select" aria-label="Stimme auswählen"></select>
      <button class="small primary" id="btn-voice">Aktivieren</button>
    </div>
    <div class="voice-active" id="active-voice">Aktiv: de-DE-FlorianMultilingualNeural</div>
  </div>

  <div class="row">
    <span class="lbl">Tempo:</span>
    <button class="chip on" data-r="+0%"  >x1</button>
    <button class="chip"    data-r="+50%" >x1,5</button>
    <button class="chip"    data-r="+75%" >x1,75</button>
    <button class="chip"    data-r="+100%">x2</button>
    <button class="chip"    data-r="+125%">x2,25</button>
    <button class="chip"    data-r="+150%">x2,5</button>
  </div>

  <div class="panel">
    <div class="panel-title">Speichern</div>
    <div class="grid2">
      <input id="clip-title" type="text" placeholder="Titel der Eingabe">
      <select id="save-category" aria-label="Kategorie fürs Speichern"></select>
    </div>
    <div class="row">
      <button class="small primary" id="btn-save">Eingabe speichern</button>
      <input id="new-category" type="text" placeholder="Neue Kategorie">
      <button class="small" id="btn-category">Kategorie erstellen</button>
    </div>
  </div>

  <div class="panel">
    <div class="row library-head">
      <div class="panel-title">Soundboard</div>
      <select id="filter-category" aria-label="Kategorie anzeigen"></select>
    </div>
    <div class="library-list" id="library-list"></div>
  </div>

  <div class="row">
    <button class="main" id="btn-speak">▶ Sprechen</button>
    <button class="main" id="btn-pause" disabled>⏸ Pause</button>
    <button class="main" id="btn-stop"  disabled>■ Stop</button>
  </div>

  <div class="seek-wrap" id="seek-wrap">
    <div id="seek-fill"></div>
    <div id="seek-knob"></div>
  </div>
  <div class="inf" id="inf"></div>
  <div id="st"></div>
  <div id="dbg"></div>

</div>
<script>
(function(){
'use strict';

const ta      = document.getElementById('ta');
const rv      = document.getElementById('reading-view');
const ctrEl   = document.getElementById('ctr');
const btnSpk  = document.getElementById('btn-speak');
const btnPause= document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const voiceSel= document.getElementById('voice-select');
const btnVoice= document.getElementById('btn-voice');
const activeVoiceEl = document.getElementById('active-voice');
const clipTitle = document.getElementById('clip-title');
const saveCat = document.getElementById('save-category');
const filterCat = document.getElementById('filter-category');
const newCat = document.getElementById('new-category');
const btnCat = document.getElementById('btn-category');
const btnSave = document.getElementById('btn-save');
const libraryList = document.getElementById('library-list');
const seekW   = document.getElementById('seek-wrap');
const seekF   = document.getElementById('seek-fill');
const seekK   = document.getElementById('seek-knob');
const infEl   = document.getElementById('inf');
const stEl    = document.getElementById('st');
const dbgEl   = document.getElementById('dbg');

/* API-URL relativ zum aktuellen Pfad — funktioniert unter /tts/ */
const BASE = location.pathname.replace(/[^/]*$/, '');
const API  = BASE + 'speak';
const VOICES_API = BASE + 'voices';

const MAX = 1111111;
const CK  = 280;
const STORE_KEY = 'flextrawurst.tts.soundboard.v1';
const DEFAULT_VOICE = 'de-DE-FlorianMultilingualNeural';
const DEFAULT_CAT = 'Allgemein';

let rate    = '+0%';
let activeVoice = localStorage.getItem('tts.activeVoice') || DEFAULT_VOICE;
let store = loadStore();
let chunks  = [];
let sess    = 0;
let paused  = false;
let pResume = null;
let curSrc  = null;
let actx    = null;

function st(msg, cls) { stEl.textContent = msg; stEl.className = cls || ''; }
function dbg(msg)     { dbgEl.textContent = msg; }
function ctrl(on)     { btnSpk.disabled=on; btnPause.disabled=!on; btnStop.disabled=!on; }
function pct(i)       { return chunks.length ? (i/chunks.length*100).toFixed(1)+'%' : '0%'; }
function setSeek(p)   { seekF.style.width=p; seekK.style.left=p; }
function uid()         { return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function esc(s)        { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shortText(s,n){ return s.length > n ? s.slice(0,n-1).trim()+'…' : s; }
function fileSafe(s){
  return (s || 'tts')
    .toLowerCase()
    .replace(/[^a-z0-9äöüß_-]+/gi,'-')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'')
    .slice(0,80) || 'tts';
}

function loadStore(){
  try {
    const parsed = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    const categories = Array.isArray(parsed.categories) && parsed.categories.length
      ? parsed.categories.filter(Boolean)
      : [DEFAULT_CAT];
    const clips = Array.isArray(parsed.clips) ? parsed.clips : [];
    return { categories: Array.from(new Set([DEFAULT_CAT, ...categories])), clips };
  } catch(e) {
    return { categories: [DEFAULT_CAT], clips: [] };
  }
}

function saveStore(){
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

function setActiveVoice(v){
  activeVoice = v || DEFAULT_VOICE;
  localStorage.setItem('tts.activeVoice', activeVoice);
  activeVoiceEl.textContent = 'Aktiv: '+activeVoice;
}

function renderCategories(){
  const filterCurrent = filterCat.value || 'Alle';
  const saveCurrent = saveCat.value || DEFAULT_CAT;
  saveCat.innerHTML = store.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  filterCat.innerHTML = '<option value="Alle">Alle Kategorien</option>' +
    store.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  saveCat.value = store.categories.includes(saveCurrent) ? saveCurrent : DEFAULT_CAT;
  filterCat.value = filterCurrent === 'Alle' || store.categories.includes(filterCurrent) ? filterCurrent : 'Alle';
}

function renderLibrary(){
  renderCategories();
  const cat = filterCat.value || 'Alle';
  const categoryOptions = current => store.categories
    .map(c=>`<option value="${esc(c)}"${c === current ? ' selected' : ''}>${esc(c)}</option>`)
    .join('');
  const clips = store.clips
    .filter(c=>cat === 'Alle' || c.category === cat)
    .sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  if (!clips.length){
    libraryList.innerHTML = '<div class="empty">Noch keine gespeicherten Eingaben in dieser Kategorie.</div>';
    return;
  }
  libraryList.innerHTML = clips.map(c=>`
    <div class="clip" data-id="${esc(c.id)}">
      <div>
        <div class="clip-title">${esc(c.title)}</div>
        <div class="clip-text">${esc(shortText(c.text.replace(/\s+/g,' '), 180))}</div>
        <div class="clip-meta">${esc(c.category)} · ${esc(c.voice || DEFAULT_VOICE)} · ${esc(c.rate || '+0%')}</div>
        <div class="clip-move">
          <span class="lbl">Kategorie:</span>
          <select class="clip-category" data-act="move">${categoryOptions(c.category || DEFAULT_CAT)}</select>
        </div>
      </div>
      <div class="clip-actions">
        <button class="small" data-act="load">Laden</button>
        <button class="small primary" data-act="play">▶</button>
        <button class="small" data-act="mp3">MP3</button>
        <button class="small" data-act="wav">WAV</button>
        <button class="small danger" data-act="delete">Löschen</button>
      </div>
    </div>
  `).join('');
}

ta.addEventListener('input', ()=>{
  const n = ta.value.length;
  ctrEl.textContent = n.toLocaleString('de') + ' / 1.111.111';
  ctrEl.className = 'counter'+(n>MAX*.99?' over':n>MAX*.85?' warn':'');
});

document.querySelectorAll('.chip[data-r]').forEach(b=>{
  b.addEventListener('click', ()=>{
    rate = b.dataset.r;
    document.querySelectorAll('.chip[data-r]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
});

function setRate(nextRate){
  const btn = Array.from(document.querySelectorAll('.chip[data-r]'))
    .find(x=>x.dataset.r === (nextRate || '+0%'));
  if (!btn) return;
  rate = btn.dataset.r;
  document.querySelectorAll('.chip[data-r]').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
}

async function loadVoices(){
  voiceSel.innerHTML = '<option>Lädt Stimmen…</option>';
  try {
    const res = await fetch(VOICES_API, {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP '+res.status);
    const voices = await res.json();
    voices.sort((a,b)=>{
      const ade = String(a.locale || '').startsWith('de') ? 0 : 1;
      const bde = String(b.locale || '').startsWith('de') ? 0 : 1;
      return ade - bde || String(a.locale).localeCompare(String(b.locale)) || String(a.name).localeCompare(String(b.name));
    });
    voiceSel.innerHTML = voices.map(v=>{
      const label = `${v.locale || '??'} · ${v.name} · ${v.gender || '?'}`;
      return `<option value="${esc(v.name)}">${esc(label)}</option>`;
    }).join('');
    voiceSel.value = activeVoice;
    if (voiceSel.value !== activeVoice){
      const fallback = Array.from(voiceSel.options).find(o=>o.value === DEFAULT_VOICE) || voiceSel.options[0];
      if (fallback) voiceSel.value = fallback.value;
      setActiveVoice(voiceSel.value);
    }
  } catch(e) {
    voiceSel.innerHTML = `<option value="${esc(activeVoice)}">${esc(activeVoice)}</option>`;
    dbg('Stimmenliste nicht geladen: '+e.message);
  }
  setActiveVoice(activeVoice);
}

function addCategory(){
  const name = newCat.value.trim();
  if (!name) return;
  if (!store.categories.includes(name)) store.categories.push(name);
  newCat.value = '';
  saveStore();
  renderCategories();
  saveCat.value = name;
  filterCat.value = name;
  renderLibrary();
}

function saveClip(){
  const text = ta.value.trim();
  if (!text){ st('Kein Text zum Speichern.','err'); return; }
  const category = saveCat.value || DEFAULT_CAT;
  if (!store.categories.includes(category)) store.categories.push(category);
  const title = clipTitle.value.trim() || shortText(strip(text).replace(/\s+/g,' '), 48) || 'Ohne Titel';
  store.clips.push({
    id: uid(),
    title,
    text,
    category,
    voice: activeVoice,
    rate,
    createdAt: new Date().toISOString()
  });
  clipTitle.value = '';
  saveStore();
  filterCat.value = category;
  renderLibrary();
  st('Gespeichert.','ok');
}

async function speakCurrent(){
  const raw = ta.value.trim();
  if (!raw){ st('Kein Text.','err'); return; }
  const clean = strip(raw);
  if (!clean){ st('Kein lesbarer Text.','err'); return; }
  chunks = splitChunks(clean);
  buildRV();
  setSeek('0%');
  infEl.textContent='';
  dbg('');
  await startFrom(0);
}

function loadClip(id, play){
  const clip = store.clips.find(c=>c.id === id);
  if (!clip) return;
  ta.value = clip.text;
  ta.dispatchEvent(new Event('input'));
  saveCat.value = clip.category || DEFAULT_CAT;
  if (clip.voice){
    voiceSel.value = clip.voice;
    setActiveVoice(clip.voice);
  }
  setRate(clip.rate || '+0%');
  st('Geladen: '+clip.title,'');
  if (play) speakCurrent();
}

async function fetchAudioPart(text, voice, rateValue){
  let lastErr;
  for (let attempt=1; attempt<=4; attempt++){
    try {
      dbg(`download fetch ${attempt}/4…`);
      const r = await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text, rate: rateValue || '+0%', voice: voice || DEFAULT_VOICE})
      });
      if (!r.ok) throw new Error('HTTP '+r.status);
      const ab = await r.arrayBuffer();
      dbg('');
      return ab;
    } catch(e){
      lastErr = e;
      dbg(`download fehler ${attempt}: ${e.message}`);
      if (attempt < 4) await new Promise(r=>setTimeout(r, 900*attempt));
    }
  }
  throw lastErr;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

function encodeWav(audioBuffer){
  const channels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const samples = audioBuffer.length;
  const blockAlign = channels * 2;
  const dataSize = samples * blockAlign;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  let offset = 0;
  const writeString = s => {
    for (let i=0; i<s.length; i++) view.setUint8(offset++, s.charCodeAt(i));
  };
  writeString('RIFF');
  view.setUint32(offset, 36 + dataSize, true); offset += 4;
  writeString('WAVE');
  writeString('fmt ');
  view.setUint32(offset, 16, true); offset += 4;
  view.setUint16(offset, 1, true); offset += 2;
  view.setUint16(offset, channels, true); offset += 2;
  view.setUint32(offset, sampleRate, true); offset += 4;
  view.setUint32(offset, sampleRate * blockAlign, true); offset += 4;
  view.setUint16(offset, blockAlign, true); offset += 2;
  view.setUint16(offset, 16, true); offset += 2;
  writeString('data');
  view.setUint32(offset, dataSize, true); offset += 4;
  const channelData = [];
  for (let ch=0; ch<channels; ch++) channelData.push(audioBuffer.getChannelData(ch));
  for (let i=0; i<samples; i++){
    for (let ch=0; ch<channels; ch++){
      const s = Math.max(-1, Math.min(1, channelData[ch][i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      offset += 2;
    }
  }
  return new Blob([buffer], {type:'audio/wav'});
}

function joinAudioBuffers(buffers){
  if (!buffers.length) throw new Error('Keine Audio-Daten.');
  const sampleRate = buffers[0].sampleRate;
  const channels = buffers[0].numberOfChannels;
  const total = buffers.reduce((sum,b)=>sum+b.length, 0);
  const merged = actx.createBuffer(channels, total, sampleRate);
  let offset = 0;
  buffers.forEach(buf=>{
    for (let ch=0; ch<channels; ch++){
      merged.getChannelData(ch).set(buf.getChannelData(Math.min(ch, buf.numberOfChannels-1)), offset);
    }
    offset += buf.length;
  });
  return merged;
}

async function downloadClip(id, format){
  const clip = store.clips.find(c=>c.id === id);
  if (!clip) return;
  const clean = strip(clip.text);
  if (!clean){ st('Kein lesbarer Text für Download.','err'); return; }
  const parts = splitChunks(clean);
  const voice = clip.voice || DEFAULT_VOICE;
  const rateValue = clip.rate || '+0%';
  const baseName = fileSafe(clip.title);
  st(`Download ${format.toUpperCase()} 1/${parts.length}…`,'wait');
  try {
    const audioParts = [];
    for (let i=0; i<parts.length; i++){
      st(`Download ${format.toUpperCase()} ${i+1}/${parts.length}…`,'wait');
      audioParts.push(await fetchAudioPart(parts[i], voice, rateValue));
    }
    if (format === 'mp3'){
      downloadBlob(new Blob(audioParts, {type:'audio/mpeg'}), `${baseName}.mp3`);
    } else {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      const decoded = [];
      for (const part of audioParts) decoded.push(await actx.decodeAudioData(part.slice(0)));
      downloadBlob(encodeWav(joinAudioBuffers(decoded)), `${baseName}.wav`);
    }
    st(`Download ${format.toUpperCase()} fertig.`,'ok');
  } catch(e){
    st(`Download fehlgeschlagen: ${e.message}`,'err');
  } finally {
    dbg('');
  }
}

function strip(t){
  return t
    .replace(/```[\s\S]*?```/g,' ')
    .replace(/`[^`]+`/g,' ')
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/\*([^*]+)\*/g,'$1')
    .replace(/__([^_]+)__/g,'$1')
    .replace(/_([^_]+)_/g,'$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/^[-*+]\s+/gm,'')
    .replace(/^\d+\.\s+/gm,'')
    .replace(/^[-_*]{3,}$/gm,'')
    .replace(/>\s*/gm,'')
    .replace(/[ \t]{2,}/g,' ')
    .trim();
}

function splitChunks(t){
  const parts = [];
  let rest = t;
  while (rest.length > 0){
    if (rest.length <= CK){ parts.push(rest.trim()); break; }
    const sub = rest.slice(0, CK);
    const m   = sub.search(/[.!?][^.!?]*$/);
    if (m > 10){
      parts.push(rest.slice(0, m+1).trim());
      rest = rest.slice(m+1).trim();
    } else {
      const sp = sub.lastIndexOf(' ');
      if (sp > 0){ parts.push(sub.slice(0,sp).trim()); rest = rest.slice(sp).trim(); }
      else       { parts.push(sub.trim()); rest = rest.slice(CK).trim(); }
    }
  }
  return parts.filter(p=>p.length>0);
}

function buildRV(){
  rv.innerHTML = chunks.map((c,i)=>{
    const safe = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<span class="rv-chunk" data-i="${i}">${safe} </span>`;
  }).join('');
  rv.querySelectorAll('.rv-chunk').forEach(el=>{
    el.addEventListener('click', ()=>jump(+el.dataset.i));
  });
}

function hlRV(i){
  rv.querySelectorAll('.rv-chunk').forEach((el,j)=>{
    el.className = 'rv-chunk'+(j<i?' done':j===i?' active':'');
  });
  const a = rv.querySelector('.rv-chunk.active');
  if (a) a.scrollIntoView({block:'nearest',behavior:'smooth'});
}

async function fetchBuf(text, sid){
  let lastErr;
  for (let attempt=1; attempt<=4; attempt++){
    if (sid !== sess) throw new Error('dead');
    try {
      dbg(`fetch ${attempt}/4…`);
      const r = await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text, rate, voice: activeVoice})
      });
      if (!r.ok) throw new Error('HTTP '+r.status);
      const ab = await r.arrayBuffer();
      if (sid !== sess) throw new Error('dead');
      dbg('');
      return await actx.decodeAudioData(ab);
    } catch(e){
      if (e.message==='dead') throw e;
      lastErr = e;
      dbg(`fehler ${attempt}: ${e.message}`);
      if (attempt < 4 && sid === sess){
        await new Promise(r=>setTimeout(r, 900*attempt));
      }
    }
  }
  throw lastErr;
}

function playBuf(buf, sid){
  return new Promise(resolve=>{
    if (sid !== sess){ resolve(); return; }
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.onended = resolve;
    curSrc = src;
    src.start(0);
  });
}

function waitResume(sid){
  if (!paused || sid !== sess) return Promise.resolve();
  return new Promise(r=>{ pResume = r; });
}

async function loop(from, sid){
  const tot = chunks.length;
  for (let i=from; i<tot; i++){
    if (sid !== sess) return;
    await waitResume(sid);
    if (sid !== sess) return;

    st(`Lädt ${i+1}/${tot}…`,'wait');

    let buf;
    try {
      buf = await fetchBuf(chunks[i], sid);
    } catch(e){
      if (sid !== sess) return;
      st('Fehler: '+e.message,'err');
      ctrl(false);
      rv.style.display='none';
      return;
    }

    if (sid !== sess) return;
    await waitResume(sid);
    if (sid !== sess) return;

    setSeek(pct(i));
    infEl.textContent = `${i+1} / ${tot}`;
    hlRV(i);
    st(`Spielt ${i+1}/${tot}`,'ok');

    await playBuf(buf, sid);
  }

  if (sid !== sess) return;
  setSeek('100%');
  hlRV(tot);
  st('Fertig ✓','');
  infEl.textContent='';
  ctrl(false);
  btnPause.textContent='⏸ Pause';
  rv.style.display='none';
}

async function startFrom(from){
  if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if (actx.state === 'suspended') await actx.resume();

  sess++;
  const sid = sess;

  if (curSrc){ try{ curSrc.stop(); }catch(e){} curSrc=null; }
  paused = false;
  if (pResume){ pResume(); pResume=null; }
  btnPause.textContent = '⏸ Pause';
  ctrl(true);
  setSeek(pct(from));
  dbg('');
  rv.style.display = 'block';

  await loop(from, sid);
}

function jump(i){
  if (!chunks.length) return;
  startFrom(Math.max(0, Math.min(chunks.length-1, i)));
}

btnSpk.addEventListener('click', speakCurrent);

btnVoice.addEventListener('click', ()=>{
  setActiveVoice(voiceSel.value || DEFAULT_VOICE);
  st('Stimme aktiviert.','ok');
});

btnCat.addEventListener('click', addCategory);
newCat.addEventListener('keydown', e=>{
  if (e.key === 'Enter') addCategory();
});

btnSave.addEventListener('click', saveClip);
filterCat.addEventListener('change', renderLibrary);

libraryList.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-act]');
  const clipEl = e.target.closest('.clip');
  if (!btn || !clipEl) return;
  const id = clipEl.dataset.id;
  if (btn.dataset.act === 'load') loadClip(id, false);
  if (btn.dataset.act === 'play') loadClip(id, true);
  if (btn.dataset.act === 'mp3') downloadClip(id, 'mp3');
  if (btn.dataset.act === 'wav') downloadClip(id, 'wav');
  if (btn.dataset.act === 'delete'){
    store.clips = store.clips.filter(c=>c.id !== id);
    saveStore();
    renderLibrary();
    st('Gelöscht.','');
  }
});

libraryList.addEventListener('change', e=>{
  const sel = e.target.closest('select[data-act="move"]');
  const clipEl = e.target.closest('.clip');
  if (!sel || !clipEl) return;
  const clip = store.clips.find(c=>c.id === clipEl.dataset.id);
  if (!clip) return;
  clip.category = sel.value || DEFAULT_CAT;
  saveStore();
  renderLibrary();
  st('Verschoben nach: '+clip.category,'ok');
});

btnPause.addEventListener('click', ()=>{
  if (!actx) return;
  if (paused){
    paused = false;
    btnPause.textContent = '⏸ Pause';
    st('Spielt …','ok');
    actx.resume();
    if (pResume){ pResume(); pResume=null; }
  } else {
    paused = true;
    btnPause.textContent = '▶ Weiter';
    st('Pausiert','pause');
    actx.suspend();
  }
});

btnStop.addEventListener('click', ()=>{
  sess++;
  paused = false;
  if (pResume){ pResume(); pResume=null; }
  if (curSrc){ try{ curSrc.stop(); }catch(e){} curSrc=null; }
  setSeek('0%');
  infEl.textContent='';
  dbg('');
  st('Gestoppt.','');
  ctrl(false);
  btnPause.textContent = '⏸ Pause';
  rv.style.display = 'none';
});

let dragging = false;
function seekPos(cx){
  const r = seekW.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (cx-r.left)/r.width));
  setSeek((p*100).toFixed(1)+'%');
  return Math.floor(p * chunks.length);
}
seekW.addEventListener('mousedown', e=>{
  if (!chunks.length) return;
  dragging=true; e.preventDefault();
  seekPos(e.clientX);
});
document.addEventListener('mousemove', e=>{ if(dragging) seekPos(e.clientX); });
document.addEventListener('mouseup',   e=>{
  if (!dragging) return;
  dragging=false;
  jump(seekPos(e.clientX));
});
seekW.addEventListener('touchstart', e=>{
  if (!chunks.length) return;
  dragging=true; seekPos(e.touches[0].clientX);
},{passive:true});
document.addEventListener('touchmove', e=>{ if(dragging) seekPos(e.touches[0].clientX); },{passive:true});
document.addEventListener('touchend',  e=>{
  if (!dragging) return;
  dragging=false;
  jump(seekPos(e.changedTouches[0].clientX));
});

renderLibrary();
loadVoices();
ta.dispatchEvent(new Event('input'));

})();
</script>

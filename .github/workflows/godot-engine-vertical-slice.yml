name: Godot Engine Vertical Slice

on:
  push:
    branches:
      - engine/godot-vertical-slice-001
    paths:
      - "engine/godot-vertical-slice/**"
      - ".github/workflows/godot-engine-vertical-slice.yml"
  pull_request:
    paths:
      - "engine/godot-vertical-slice/**"
      - ".github/workflows/godot-engine-vertical-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://godot-releases.nbg1.your-objectstorage.com/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Run structural smoke test
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path engine/godot-vertical-slice \
            --script res://tests/headless_smoke.gd

      - name: Boot main scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path engine/godot-vertical-slice \
            --quit-after 3

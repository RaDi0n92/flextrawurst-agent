name: ChatGPT Repository Export Split Transport

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact tracked snapshot and transport chunks
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="c61f7d1d38e8a76e6dc5fce5b821d8303f6085cf"
          mkdir -p export_transport
          ARCHIVE="export_transport/RaDi0n92_flextrawurst-agent_${COMMIT}.zip"
          git archive --format=zip --output="$ARCHIVE" "$COMMIT"
          sha256sum "$ARCHIVE" > export_transport/FULL_ARCHIVE_SHA256.txt
          stat --printf='%s bytes\n' "$ARCHIVE" > export_transport/FULL_ARCHIVE_SIZE.txt
          git show -s --format=fuller "$COMMIT" > export_transport/ORIGINAL_COMMIT.txt
          printf '%s\n' "$COMMIT" > export_transport/ORIGINAL_COMMIT_SHA.txt
          split --bytes=240000000 --numeric-suffixes=0 --suffix-length=3 \
            "$ARCHIVE" export_transport/repo.zip.transport-part-
          rm "$ARCHIVE"
          sha256sum export_transport/repo.zip.transport-part-* > export_transport/TRANSPORT_PARTS_SHA256.txt
          ls -l export_transport/repo.zip.transport-part-* > export_transport/TRANSPORT_PARTS_SIZES.txt

      - name: Upload transport part 000
        uses: actions/upload-artifact@v4
        with:
          name: flextrawurst-agent-transport-000
          path: export_transport/repo.zip.transport-part-000
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload transport part 001
        uses: actions/upload-artifact@v4
        with:
          name: flextrawurst-agent-transport-001
          path: export_transport/repo.zip.transport-part-001
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload transport part 002
        uses: actions/upload-artifact@v4
        with:
          name: flextrawurst-agent-transport-002
          path: export_transport/repo.zip.transport-part-002
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload transport part 003 if present
        if: ${{ hashFiles('export_transport/repo.zip.transport-part-003') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: flextrawurst-agent-transport-003
          path: export_transport/repo.zip.transport-part-003
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload transport manifest
        uses: actions/upload-artifact@v4
        with:
          name: flextrawurst-agent-transport-manifest
          path: |
            export_transport/FULL_ARCHIVE_SHA256.txt
            export_transport/FULL_ARCHIVE_SIZE.txt
            export_transport/ORIGINAL_COMMIT.txt
            export_transport/ORIGINAL_COMMIT_SHA.txt
            export_transport/TRANSPORT_PARTS_SHA256.txt
            export_transport/TRANSPORT_PARTS_SIZES.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

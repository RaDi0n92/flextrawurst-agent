name: Godot VPS acceptance and completion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/godot-vps-acceptance.yml'
      - 'tools/godot_vps_acceptance/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-vps-acceptance
  cancel-in-progress: false

jobs:
  accept-via-ssh:
    name: Verify and complete Godot bridge through VPS SSH
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSH_HOST: ${{ secrets.VPS_HOST || secrets.SSH_HOST || secrets.DEPLOY_HOST || secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.VPS_USER || secrets.SSH_USER || secrets.DEPLOY_USER || secrets.SERVER_USER || 'root' }}
      SSH_PORT: ${{ secrets.VPS_PORT || secrets.SSH_PORT || '22' }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.VPS_PRIVATE_KEY || secrets.DEPLOY_KEY }}
      SSH_PASSWORD: ${{ secrets.VPS_PASSWORD || secrets.SSH_PASSWORD || secrets.SERVER_PASSWORD }}
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run isolated acceptance on Werkraum VPS
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo 'No configured VPS or SSH host secret'; exit 21; }
          mkdir -p "$RUNNER_TEMP/godot-vps-proof"

          if [ -n "$SSH_KEY" ]; then
            KEY_FILE="$RUNNER_TEMP/vps_key"
            printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            SSH=(ssh -i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
            SCP=(scp -i "$KEY_FILE" -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          elif [ -n "$SSH_PASSWORD" ]; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new)
            SCP=(sshpass -e scp -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new)
          else
            echo 'No configured VPS SSH key or password secret'
            exit 22
          fi

          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "TRIGGER_SHA='$TRIGGER_SHA' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          test -d /root/werkraum
          test -d /root/werkraum/engine
          command -v git >/dev/null
          TMP="$(mktemp -d /tmp/godot-vps-acceptance.XXXXXX)"
          PROOF="/tmp/godot-vps-acceptance-${GITHUB_RUN_ID}.json"
          trap 'rm -rf "$TMP"' EXIT
          git clone --quiet https://github.com/RaDi0n92/flextrawurst-agent.git "$TMP/repo"
          git -C "$TMP/repo" checkout --quiet "$TRIGGER_SHA"
          cd "$TMP/repo"
          if [ "$(id -u)" -eq 0 ]; then
            python3 tools/godot_vps_acceptance/accept_and_complete.py
          else
            sudo -n python3 tools/godot_vps_acceptance/accept_and_complete.py
          fi
          test -f ops/proofs/godot-vps-acceptance.json
          if [ "$(id -u)" -eq 0 ]; then
            cp ops/proofs/godot-vps-acceptance.json "$PROOF"
            chmod 644 "$PROOF"
          else
            sudo -n cp ops/proofs/godot-vps-acceptance.json "$PROOF"
            sudo -n chmod 644 "$PROOF"
          fi
          REMOTE

          REMOTE_PROOF="/tmp/godot-vps-acceptance-${GITHUB_RUN_ID}.json"
          "${SCP[@]}" "$SSH_USER@$SSH_HOST:$REMOTE_PROOF" "$RUNNER_TEMP/godot-vps-proof/godot-vps-acceptance.json"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE_PROOF'"

      - name: Commit VPS proof report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/proofs
          cp "$RUNNER_TEMP/godot-vps-proof/godot-vps-acceptance.json" ops/proofs/godot-vps-acceptance.json
          git config user.name 'gpt5.6-sol-high-godot-vps-runner'
          git config user.email 'gpt56-sol-high@users.noreply.github.com'
          git add ops/proofs/godot-vps-acceptance.json
          git commit -m 'proof: Godot VPS acceptance report'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce completed acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('ops/proofs/godot-vps-acceptance.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'status': proof.get('status'),
              'critical_failures': proof.get('critical_failures', []),
              'missing': proof.get('missing', []),
          }, ensure_ascii=False, indent=2))
          raise SystemExit(0 if proof.get('status') == 'COMPLETE' else 1)
          PY

name: Godot VPS acceptance and completion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/godot-vps-acceptance.yml'
      - 'tools/godot_vps_acceptance/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-vps-acceptance
  cancel-in-progress: false

jobs:
  accept-on-vps-runner:
    name: Verify and complete Godot bridge directly on Werkraum VPS
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm runner is the Werkraum VPS
        shell: bash
        run: |
          set -euo pipefail
          test -d /root/werkraum
          test -d /root/werkraum/engine
          test -f tools/godot_vps_acceptance/accept_and_complete.py
          printf 'Runner host: '; hostname
          printf 'Runner user: '; id
          printf 'Werkraum engine: '; stat -c '%n %U:%G %a' /root/werkraum/engine

      - name: Run isolated Godot acceptance directly on VPS
        id: vps
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            python3 tools/godot_vps_acceptance/accept_and_complete.py
          else
            sudo -n python3 tools/godot_vps_acceptance/accept_and_complete.py
          fi

      - name: Commit VPS proof or runner diagnosis
        if: always()
        shell: bash
        env:
          VPS_STEP_OUTCOME: ${{ steps.vps.outcome }}
          TRIGGER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p ops/proofs
          TARGET='ops/proofs/godot-vps-acceptance.json'
          if [ ! -f "$TARGET" ]; then
            python3 - <<'PY'
          import json
          import os
          import socket
          from datetime import datetime, timezone
          from pathlib import Path

          report = {
              'status': 'RUNNER_EXECUTION_FAILED',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'host': socket.gethostname(),
              'workflow_run_id': os.environ['RUN_ID'],
              'workflow_run_attempt': os.environ['RUN_ATTEMPT'],
              'trigger_sha': os.environ['TRIGGER_SHA'],
              'vps_step_outcome': os.environ['VPS_STEP_OUTCOME'],
              'meaning': 'Der Self-Hosted-Runner erreichte den VPS-Arbeitskörper, aber der Abnahmekörper erzeugte keinen Bericht.',
          }
          Path('ops/proofs/godot-vps-acceptance.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          fi
          git config user.name 'gpt5.6-sol-high-godot-vps-runner'
          git config user.email 'gpt56-sol-high@users.noreply.github.com'
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo 'Godot VPS proof is unchanged; no commit required.'
          else
            git commit -m 'proof: Godot VPS acceptance report via self-hosted runner'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce completed acceptance
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path('ops/proofs/godot-vps-acceptance.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'status': proof.get('status'),
              'host': proof.get('host'),
              'critical_failures': proof.get('critical_failures', []),
              'missing': proof.get('missing', []),
              'meaning': proof.get('meaning'),
          }, ensure_ascii=False, indent=2))
          raise SystemExit(0 if proof.get('status') == 'COMPLETE' else 1)
          PY

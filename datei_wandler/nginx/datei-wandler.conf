server {
    listen 8449 ssl;
    server_name 217.154.14.29;

    ssl_certificate /etc/nginx/geni-selfsigned.crt;
    ssl_certificate_key /etc/nginx/geni-selfsigned.key;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 64m;

    auth_basic "Datei-Wandler";
    auth_basic_user_file /etc/nginx/.htpasswd_datei_wandler;

    location / {
        proxy_pass http://127.0.0.1:8878;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }
}
